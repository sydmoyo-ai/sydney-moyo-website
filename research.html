<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Research in aquatic–terrestrial connections, food webs, biodiversity and contaminants at Louisiana State University.">
<title>Research | Sydney Moyo</title>
<link rel="stylesheet" href="styles.css">
<style>
.research-hero{padding:65px 0 32px}.research-hero h1{max-width:960px}
.research-hero .lead{max-width:920px}
.research-list{display:grid;gap:38px;padding-bottom:80px}
.theme{border-top:1px solid var(--line);padding-top:35px}
.theme-header{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:28px}
.theme-number{font-size:.78rem;letter-spacing:.12em;font-weight:800;color:var(--green);text-transform:uppercase}
.theme h2{margin:0;font-size:clamp(1.9rem,3.2vw,2.65rem)}
.theme-description{max-width:850px;color:#465b4d;font-size:1.08rem}
.theme-content{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.9fr);gap:34px;align-items:start}
.theme h3{font-size:1.1rem;margin:0 0 16px}
.project-list{display:grid;gap:12px;margin:0}
.project{background:#fff;border:1px solid var(--line);border-radius:12px;padding:19px 22px}
.project h4{font-size:1rem;line-height:1.4;color:var(--forest);margin:0 0 7px}
.project p{color:var(--muted);font-size:.94rem;line-height:1.65;margin:0}
.papers{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:24px}
.paper{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.paper:last-of-type{padding-bottom:0;margin-bottom:16px;border-bottom:0}
.paper-title{font-weight:700;line-height:1.45;color:var(--forest);margin:0 0 6px}
.paper-meta{font-size:.85rem;line-height:1.6;color:var(--muted);margin:0}
.paper a{font-size:.86rem;font-weight:700}
.all-publications{font-weight:700}
.research-error{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
@media(max-width:800px){.theme-content{grid-template-columns:1fr}.research-hero{padding-top:44px}}
</style>
</head>
<body>
<header class="site-header">
<nav class="nav-shell" aria-label="Main navigation">
<a class="brand" href="index.html"><img src="dragonfly-logo.svg" alt="Sydney Moyo dragonfly logo"></a>
<button class="menu-toggle" aria-expanded="false" aria-controls="main-links">Menu ☰</button>
<div class="nav-links" id="main-links">
<a href="index.html">Home</a>
<a href="research.html" aria-current="page">Research</a>
<a href="publications.html">Publications</a><a href="people.html">People</a>
<a href="teaching.html">Teaching</a><a href="contact.html">Contact</a>
</div></nav></header>
<main class="wrap">
<section class="research-hero">
<div class="eyebrow">Research</div>
<h1 id="research-heading">Questions that cross boundaries</h1>
<p class="lead" id="research-intro">Exploring how energy, nutrients, and contaminants move across aquatic and terrestrial ecosystems.</p>
</section>
<div class="research-list" id="research-list" aria-live="polite"></div>
</main>
<footer class="footer wrap"><div class="footer-inner"><div>© 2026 Sydney Moyo · Department of Biological Sciences, LSU</div><div><a href="mailto:smoyo@lsu.edu">smoyo@lsu.edu</a> · <a href="contact.html">Contact</a></div></div></footer>
<script src="script.js"></script>
<script>
(function(){
const list=document.getElementById('research-list');
const node=(tag,className,txt)=>{const el=document.createElement(tag);if(className)el.className=className;if(txt!=null)el.textContent=txt;return el};
const safeArray=x=>Array.isArray(x)?x:[];
fetch('research.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('Research data could not be loaded');return response.json()}).then(data=>{
document.getElementById('research-heading').textContent=data.heading||'Questions that cross boundaries';
document.getElementById('research-intro').textContent=data.body||'';
list.replaceChildren();
safeArray(data.items).forEach((theme,i)=>{
const section=node('section','theme');
section.id=['aquatic-terrestrial-connections','food-webs-changing-world','biodiversity-contaminants'][i]||('research-theme-'+(i+1));
const head=node('div','theme-header');
head.append(node('div','theme-number','Research theme '+(i+1)),node('h2','',theme.title||'Research theme'),node('p','theme-description',theme.description||''));
section.append(head);
const content=node('div','theme-content');
const projects=node('div','');
projects.append(node('h3','','Current and ongoing projects'));
const projectsList=node('div','project-list');
safeArray(theme.projects).forEach(project=>{
const card=node('article','project');
card.append(node('h4','',project.title||''),node('p','',project.description||''));
projectsList.append(card);
});
projects.append(projectsList);
const papers=node('aside','papers');
papers.append(node('h3','','Selected publications'));
safeArray(theme.publications).forEach(pub=>{
const item=node('div','paper');
item.append(node('p','paper-title',pub.title||''),node('p','paper-meta',(pub.authors||'')+' ('+(pub.year||'')+'). '+(pub.journal||'')));
if(pub.doi){const link=node('a','','Read paper ↗');link.href='https://doi.org/'+encodeURI(pub.doi);link.target='_blank';link.rel='noopener noreferrer';item.append(link)}
papers.append(item);
});
const all=node('a','all-publications','View all publications →');all.href='publications.html';papers.append(all);
content.append(projects,papers);section.append(content);list.append(section);
});
if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target)requestAnimationFrame(()=>target.scrollIntoView());}
}).catch(err=>{list.replaceChildren(node('p','research-error','The research content is temporarily unavailable. Please try refreshing the page.'));console.error(err)});
})();
</script>
</body>
</html>
