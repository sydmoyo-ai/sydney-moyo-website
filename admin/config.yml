
backend:
  name: github
  repo: sydmoyo-ai/sydney-moyo-website
  branch: main
  base_url: https://decap-cms-auth.sydmoyo.workers.dev
  auth_endpoint: auth

media_folder: "images"
public_folder: "images"

collections:
  - name: "pages"
    label: "Website Pages"
    files:

      # HOMEPAGE
      - label: "Homepage"
        name: "home"
        file: "home.json"
        fields:
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Hero image", name: "hero_image", widget: "image", required: false}
          - {label: "Welcome heading", name: "welcome_heading", widget: "string"}
          - {label: "Welcome text", name: "welcome_text", widget: "text"}
          - {label: "Welcome image", name: "welcome_image", widget: "image", required: false}

      # RESEARCH
      - label: "Research"
        name: "research"
        file: "research.json"
        fields:
          - {label: "Page heading", name: "heading", widget: "string"}
          - {label: "Page introduction", name: "body", widget: "text"}
          - label: "Research themes"
            name: "items"
            widget: "list"
            fields:
              - {label: "Theme title", name: "title", widget: "string"}
              - {label: "Theme description", name: "description", widget: "text"}
              - {label: "Theme photograph", name: "image", widget: "image", required: false}
              - label: "Projects within this theme"
                name: "projects"
                widget: "list"
                required: false
                fields:
                  - {label: "Project title", name: "title", widget: "string"}
                  - {label: "Project description", name: "description", widget: "text"}
                  - {label: "Project photograph", name: "image", widget: "image", required: false}

      # PUBLICATIONS
      - label: "Publications"
        name: "publications"
        file: "publications.json"
        fields:
          - {label: "Page heading", name: "heading", widget: "string"}
          - {label: "Introduction", name: "intro", widget: "text"}
          - {label: "Google Scholar URL", name: "scholar_url", widget: "string", required: false}
          - label: "Publications"
            name: "items"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - {label: "Record ID", name: "id", widget: "number", value_type: "int", required: false, hint: "Keep existing IDs unchanged; use the next available number for a new publication."}
              - {label: "Year", name: "year", widget: "number", value_type: "int"}
              - {label: "Authors", name: "authors", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Journal / book / report publisher", name: "journal", widget: "string", required: false}
              - {label: "Volume, pages, article number", name: "details", widget: "string", required: false}
              - {label: "Status (e.g., In press)", name: "status", widget: "string", required: false}
              - {label: "DOI (without https://doi.org/)", name: "doi", widget: "string", required: false}
              - {label: "Publication Link (journal webpage or PDF URL)", name: "url", widget: "string", required: false}
              - label: "Publication type"
                name: "type"
                widget: "select"
                options:
                  - {label: "Peer-reviewed article", value: "article"}
                  - {label: "Book chapter or technical report", value: "other"}
                default: "article"

      # PEOPLE
      - label: "People"
        name: "people"
        file: "people.json"
        fields:
          - {label: "Page heading", name: "heading", widget: "string"}
          - {label: "Introduction", name: "body", widget: "text"}
          - {label: "Join heading", name: "join_heading", widget: "string"}
          - {label: "Join description", name: "join_text", widget: "text"}
          - label: "People"
            name: "items"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Role", name: "role", widget: "string"}
              - label: "Section"
                name: "group"
                widget: "select"
                options: ["Principal Investigator", "Graduate Students", "Undergraduate Researchers", "Postdoctoral Researchers", "Alumni"]
              - {label: "Biography", name: "bio", widget: "text", required: false}
              - {label: "Portrait", name: "image", widget: "image", required: false}
              - {label: "Profile URL", name: "url", widget: "string", required: false}

     
      # TEACHING
      - label: "Teaching"
        name: "teaching"
        file: "teaching.json"
        fields:
          - {label: "Page heading", name: "heading", widget: "string"}

          - {label: "Teaching philosophy heading", name: "philosophy_heading", widget: "string"}
          - label: "Teaching philosophy paragraphs"
            name: "philosophy_paragraphs"
            widget: "list"
            field: {label: "Paragraph", name: "paragraph", widget: "text"}

          - {label: "Courses heading", name: "courses_heading", widget: "string"}
          - label: "Courses at LSU"
            name: "courses"
            widget: "list"
            summary: "{{fields.code}} — {{fields.title}}"
            fields:
              - {label: "Course code", name: "code", widget: "string"}
              - {label: "Course title", name: "title", widget: "string"}
              - {label: "Course description", name: "description", widget: "text"}

          - {label: "Learning by doing heading", name: "learning_heading", widget: "string"}
          - {label: "Learning by doing text", name: "learning_text", widget: "text"}

          - {label: "Student mentorship heading", name: "mentorship_heading", widget: "string"}
          - {label: "Student mentorship text", name: "mentorship_text", widget: "text"}


     
      # CONTACT
      - label: "Contact"
        name: "contact"
        file: "contact.json"
        fields:
          - {label: "Page heading", name: "heading", widget: "string"}
          - {label: "Page introduction", name: "body", widget: "text"}
          - {label: "Contact email", name: "email", widget: "string"}

          - label: "Graduate students"
            name: "graduate"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "paragraph", widget: "text"}
              - {label: "Ph.D. questionnaire URL", name: "questionnaire_url", widget: "string"}
              - {label: "LSU Graduate School URL", name: "graduate_school_url", widget: "string"}
              - {label: "Biological Sciences program URL", name: "program_url", widget: "string"}

          - label: "Postdoctoral positions"
            name: "postdoc"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "paragraph", widget: "text"}
              - label: "Application requirements"
                name: "requirements"
                widget: "list"
                field: {label: "Requirement", name: "requirement", widget: "string"}
              - {label: "Funding note", name: "note", widget: "text"}

          - label: "Undergraduate students"
            name: "undergraduate"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Undergraduate questionnaire URL", name: "questionnaire_url", widget: "string"}

          - label: "Collaborations"
            name: "collaborations"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: {label: "Paragraph", name: "paragraph", widget: "text"}
