<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publications | Sydney Moyo</title>
<link rel="stylesheet" href="styles.css">
<style>
:root{--pub-green:#183f34;--pub-muted:#59685f;--pub-cream:#f8f6ef;--pub-border:#dedfd6}
.pub-wrap{color:#24352e}
.pub-nav{background:var(--pub-green);padding:16px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.pub-brand{color:#fff;text-decoration:none;font-size:1.2rem;font-weight:700;letter-spacing:.01em}
.pub-links{display:flex;gap:17px;flex-wrap:wrap}.pub-links a{color:#f5f3e9;text-decoration:none;font-size:.88rem}.pub-links a[aria-current=page]{text-decoration:underline;text-underline-offset:6px}
.pub-wrap{max-width:1020px;margin:auto;padding:62px 24px 100px}
.pub-eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:.75rem;color:#68786c;font-weight:700}
h1{font-family:Georgia,serif;color:var(--pub-green);font-size:clamp(2.7rem,6vw,4.4rem);margin:10px 0 15px}
.pub-intro{font-size:1.06rem;color:var(--pub-muted);line-height:1.7;max-width:680px}
.pub-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:26px 0 32px}
.pub-button{display:inline-block;background:var(--pub-green);color:#fff!important;padding:12px 18px;border-radius:5px;text-decoration:none;font-weight:650;font-size:.9rem}
.pub-search{width:min(100%,390px);box-sizing:border-box;padding:12px 14px;border:1px solid #bfc9c1;border-radius:5px;background:#fff;font:inherit}
.pub-count{color:var(--pub-muted);font-size:.88rem;margin:0 0 35px}
.pub-section{margin:48px 0 20px;border-bottom:2px solid var(--pub-green);padding-bottom:12px;font-family:Georgia,serif;font-size:1.65rem;color:var(--pub-green)}
.pub-year{color:var(--pub-green);font-size:1.15rem;margin:32px 0 8px}
.pub-item{padding:12px 0 15px;border-bottom:1px solid var(--pub-border)}
.pub-title{font-weight:700;font-size:1.02rem;line-height:1.5}.pub-authors{margin:6px 0;color:#45554b;line-height:1.6;font-size:.94rem}.pub-journal{font-style:italic;color:#53645a;font-size:.92rem}
.pub-doi{display:inline-block;margin-top:7px;color:#1b6047;font-size:.87rem;text-decoration:underline;text-underline-offset:3px}.pub-status{font-size:.8rem;color:#54665a;margin-left:8px}
.pub-error{padding:18px;background:#fff;border:1px solid #e1d9c7;border-radius:6px}
@media(max-width:640px){.pub-wrap{padding-top:38px}.pub-nav{padding:18px 22px}.pub-links{gap:12px}}
</style>
</head>
<body>
<header class="site-header"><nav class="nav-shell" aria-label="Main navigation"><a class="brand" href="index.html"><img src="dragonfly-logo.svg" alt="Sydney Moyo dragonfly logo"></a><button class="menu-toggle" aria-expanded="false" aria-controls="main-links">Menu ☰</button><div class="nav-links" id="main-links"><a href="index.html">Home</a><a href="research.html">Research</a><a href="publications.html" aria-current="page">Publications</a><a href="people.html">People</a><a href="teaching.html">Teaching</a><a href="contact.html">Contact</a></div></nav></header>
<main class="pub-wrap"><div class="pub-eyebrow">Research & scholarship</div><h1 id="pub-heading">Publications</h1><p id="pub-intro" class="pub-intro">Peer-reviewed articles, book chapters, and technical reports.</p>
<div class="pub-actions"><a class="pub-button" id="scholar-link" href="https://scholar.google.com/citations?user=BjYjYKEAAAAJ" target="_blank" rel="noopener noreferrer">View Google Scholar ↗</a><input id="pub-search" class="pub-search" type="search" placeholder="Search titles, authors, journals, years…" aria-label="Search publications"></div>
<p id="pub-count" class="pub-count" aria-live="polite">Loading publications…</p><div id="pub-list" aria-live="polite"></div>
</main>
<footer class="footer wrap"><div class="footer-inner"><div>© 2026 Sydney Moyo · Department of Biological Sciences, LSU</div><div><a href="mailto:smoyo@lsu.edu">smoyo@lsu.edu</a> · <a href="contact.html">Contact</a></div></div></footer>
<script src="script.js"></script>
<script>
(()=>{
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const highlight=s=>esc(s).replace(/\b(Sydney\s+Moyo|Moyo\s*,?\s*S\.?(?:\s*,?\s*[A-Z]\.)?)(?=\s|,|&|$)/gi,'<strong>$1</strong>');
let all=[];
function render(){const q=document.getElementById('pub-search').value.toLocaleLowerCase().trim();const items=all.filter(x=>[x.title,x.authors,x.journal,x.year,x.details].join(' ').toLocaleLowerCase().includes(q));const articles=items.filter(x=>x.type==='article'),other=items.filter(x=>x.type!=='article');let out='';
function section(arr,heading){if(!arr.length)return '';let h=`<h2 class="pub-section">${heading}</h2>`;let prev=null;for(const x of arr){if(x.year!==prev){h+=`<h3 class="pub-year">${esc(x.year)}</h3>`;prev=x.year;}h+=`<article class="pub-item"><div class="pub-title">${esc(x.title)}</div><p class="pub-authors">${highlight(x.authors)}</p><div class="pub-journal">${esc(x.journal)}${x.details?', '+esc(x.details):''}</div>${x.doi?`<a class="pub-doi" href="https://doi.org/${encodeURIComponent(x.doi)}" target="_blank" rel="noopener noreferrer">DOI ↗</a>`:''}${x.status?`<span class="pub-status">${esc(x.status)}</span>`:''}</article>`;}return h;}
out=section(articles,'Peer-reviewed articles')+section(other,'Book chapters & technical reports');document.getElementById('pub-list').innerHTML=out||'<p>No publications match your search.</p>';document.getElementById('pub-count').textContent=`Showing ${articles.length} peer-reviewed article${articles.length===1?'':'s'} and ${other.length} chapter/report${other.length===1?'':'s'}`;}
fetch('publications.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{all=(data.items||[]).slice().sort((a,b)=>b.year-a.year||a.id-b.id);document.getElementById('pub-heading').textContent=data.heading||'Publications';document.getElementById('pub-intro').textContent=data.intro||'';if(data.scholar_url)document.getElementById('scholar-link').href=data.scholar_url;render();}).catch(err=>{document.getElementById('pub-count').textContent='';document.getElementById('pub-list').innerHTML='<p class="pub-error">Could not load the publication list. Check that <code>publications.json</code> is in the same folder as this page.</p>';console.error(err)});
document.getElementById('pub-search').addEventListener('input',render);
})();
</script>
</body></html>
